[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator: perfect mazes, Pac-Man boards, 42 pattern"
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "lfoti" }, { name = "mde-matt" }]

[tool.setuptools]
packages = ["mazegen"]